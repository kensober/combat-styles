<p>demon-slayer-characters-list works!</p>

<label class="variant-selector">
  Estilo de imagen
  <select [(ngModel)]="cardType">
    <option value="image-filled">Imagen ancha</option>
    <option value="image-rounded">Imagen redonda</option>
  </select>
</label>

@for (item of characterList; track item.id) {
  <app-character-card
    [data]="item"
    [type]="cardType"
  >
  </app-character-card>

} @empty {
  <p>no hay elemento para mostrar</p>
}
