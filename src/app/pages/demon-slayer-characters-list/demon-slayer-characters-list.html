<p>demon-slayer-characters-list works!</p>

<div class="characters-list">
@for (item of characterList; track item.id) {
  <app-character-card
    [id]="item.id"
    [name]="item.name"
    [description]="item.description"
    [image]="item.img">
  </app-character-card>

} @empty {
  <p>no hay elemento para mostrar</p>
}

</div>
