<mat-card class="main-container">
  <mat-card-header>
    <img
      [ngClass]="type() === characterCardType.FILLED ? 'image-filled' : 'image-rounded'"
      [src]="data().img"
      [alt]="data().name">
  </mat-card-header>
  <mat-card-content>
    <h3>{{ data().id }} - {{ data().name }}</h3>
    <p>{{ data().description }}</p>
  </mat-card-content>
  <section class="dynamic-content">
    <ng-content></ng-content>
  </section>
</mat-card>
