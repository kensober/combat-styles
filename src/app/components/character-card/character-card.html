<mat-card class="main-container" appearance="outlined">
  <img mat-card-image [src]="image()" [alt]="name()">
  <mat-card-header>
    <mat-card-title>{{ id() }} - {{ name() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ description() }}</p>
  </mat-card-content>
</mat-card>
